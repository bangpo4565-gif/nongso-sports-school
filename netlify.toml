[build]
  publish = "."

# 옛 주소(netlify.app)로 들어오면 새 주소로 보내요.
[[redirects]]
  from = "https://nongso-sports-school.netlify.app/*"
  to = "https://nongso-sports.bangssam.kr/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/admin"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/teacher"
  to = "/admin.html"
  status = 200

[[redirects]]
  from = "/student"
  to = "/index.html"
  status = 200
