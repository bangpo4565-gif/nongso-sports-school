<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0d1430">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="농소스포츠">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>농소스포츠스쿨 체험판</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700;800&family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* Layout: phone-width student app over a court-navy scoreboard ground; teacher view is sidebar + wide console. Single deliberate dark look. */
:root{
  --ink:#0d1430; --panel:#151e40; --panel2:#1c2752; --line:#2b3768;
  --fg:#eef1ff; --muted:#9aa3c8; --dim:#6b75a0;
  --court:#ff7a2f; --data:#45d2c6; --gold:#ffd166; --silver:#cfd8ea; --bronze:#e39a6a; --good:#4ade80; --warn:#fbbf24; --bad:#f87171;
  --display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.55 var(--body);margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--data);outline-offset:2px}
.num{font-family:var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em}
.eyebrow{font:600 12px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1,h2,h3{text-wrap:balance;margin:0}
.demo-bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;background:var(--court);color:#1b0d03;font-size:12.5px;font-weight:700;text-align:center;padding:5px 16px}
.demo-bar span{font-weight:500}

/* ---------- splash ---------- */
.splash{position:fixed;inset:0;z-index:60;background:var(--ink) center/cover no-repeat;display:flex;flex-direction:column;justify-content:flex-end;padding:32px 24px calc(40px + env(safe-area-inset-bottom,0px));cursor:pointer}
.splash::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,20,48,.15) 0%,rgba(13,20,48,.55) 50%,rgba(13,20,48,.96) 100%)}
.splash>*{position:relative}
.sp-tag{font:700 13px/1 var(--display);letter-spacing:.2em;color:var(--court)}
.sp-name{font:800 clamp(44px,12vw,84px)/.92 var(--display);letter-spacing:.01em;margin:10px 0 6px}
.sp-ko{font-size:17px;font-weight:700}
.sp-loop{display:flex;gap:10px;margin-top:22px;font:700 14px/1 var(--display);letter-spacing:.16em;color:var(--muted)}
.sp-loop b{color:var(--fg)}
.sp-bar{height:3px;background:rgba(255,255,255,.18);margin-top:22px;border-radius:2px;overflow:hidden;max-width:420px}
.sp-bar i{display:block;height:100%;width:0;background:var(--court);animation:load 2.2s linear forwards}
@keyframes load{to{width:100%}}

/* ---------- student shell ---------- */
.phone{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px calc(96px + env(safe-area-inset-bottom,0px));}
.topline{display:flex;justify-content:space-between;align-items:center;padding-block:16px 8px}
.brand{font:800 20px/1 var(--display);letter-spacing:.04em}
.brand em{font-style:normal;color:var(--court)}
.who{font-size:13px;color:var(--muted)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(13,20,48,.94);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs nav{max-width:480px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font:700 11px/1 var(--display);letter-spacing:.08em;color:var(--dim)}
.tabs button svg{width:22px;height:22px}
.tabs button.on{color:var(--court)}
.tabs .check-dot{position:relative}
.tabs .live::after{content:"";position:absolute;top:-1px;right:-4px;width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px var(--ink)}

.stack{display:flex;flex-direction:column;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px}
.row{display:flex;gap:12px;align-items:center}
.between{justify-content:space-between}
.muted{color:var(--muted)}
.small{font-size:13px}
.chip{display:inline-flex;align-items:center;gap:6px;font:600 11.5px/1 var(--display);letter-spacing:.1em;padding:5px 8px;border-radius:6px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.chip.ph{color:var(--warn);border-color:rgba(251,191,36,.35)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:12px;padding:14px 18px;font-weight:700;background:var(--court);color:#1b0d03;width:100%}
.btn.ghost{background:var(--panel2);color:var(--fg);border:1px solid var(--line)}
.btn.teal{background:var(--data);color:#04211f}
.btn.sm{padding:9px 12px;font-size:13px;width:auto;border-radius:9px}
.back{background:none;border:0;padding:4px 0;color:var(--muted);font-weight:700;font-size:14px;display:inline-flex;gap:6px;align-items:center}
.pagehead{display:flex;flex-direction:column;gap:6px;padding-block:6px 4px}
.pagehead h2{font:800 30px/1 var(--display);letter-spacing:.02em}

/* hero level */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:18px;background:linear-gradient(135deg,#1d2a5e 0%,#151e40 70%);border:1px solid var(--line)}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(255,122,47,.25);box-shadow:0 0 0 26px rgba(255,122,47,.06)}
.lv{display:flex;align-items:flex-end;gap:14px;position:relative;z-index:1}
.lv-num{font:800 64px/.8 var(--display)}
.lv-num small{font-size:18px;color:var(--muted);margin-right:4px}
.tier{font:800 13px/1 var(--display);letter-spacing:.16em;padding:6px 9px;border-radius:6px;background:rgba(197,208,230,.14);color:#d6deef;border:1px solid rgba(214,222,239,.3)}
.bar{height:10px;border-radius:6px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--court),#ffb27f);transition:width .8s ease}
.bar.teal i{background:linear-gradient(90deg,#1fa99e,var(--data))}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;position:relative;z-index:1}
.stat3 div{background:rgba(13,20,48,.45);border-radius:10px;padding:10px}
.stat3 b{display:block;font:700 24px/1.1 var(--display)}
.stat3 span{font-size:12px;color:var(--muted)}

.sess{display:flex;align-items:center;gap:12px;padding:14px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);width:100%;text-align:left}
.sess .tm{font:800 22px/1 var(--display);width:58px;text-align:center;color:var(--data)}
.sess .tm small{display:block;font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:4px}
.sess .meta{flex:1;min-width:0}
.sess .meta b{display:block}
.open{font:700 11px/1 var(--display);letter-spacing:.12em;color:var(--good)}

/* check */
.scanner{position:relative;aspect-ratio:1/1;max-width:100%;border-radius:18px;background:repeating-linear-gradient(45deg,#121a3a 0 10px,#141d40 10px 20px);border:1px solid var(--line);display:grid;place-items:center;overflow:hidden}
.scanner .frame{width:62%;aspect-ratio:1/1;position:relative}
.scanner .frame i{position:absolute;width:34px;height:34px;border:4px solid var(--court)}
.scanner .frame i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0;border-radius:10px 0 0 0}
.scanner .frame i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0;border-radius:0 10px 0 0}
.scanner .frame i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0;border-radius:0 0 0 10px}
.scanner .frame i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0;border-radius:0 0 10px 0}
.scanner .laser{position:absolute;left:19%;right:19%;height:2px;background:var(--court);box-shadow:0 0 12px var(--court);animation:laser 2.4s ease-in-out infinite}
@keyframes laser{0%,100%{top:22%}50%{top:76%}}
.scanner .cap{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:13px;color:var(--muted)}
.ring{position:relative;width:220px;height:220px;margin:6px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .in{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .in b{font:800 54px/1 var(--display)}
.state{display:inline-flex;align-items:center;gap:6px;font:800 12px/1 var(--display);letter-spacing:.14em;padding:6px 9px;border-radius:6px}
.st-WAITING{background:rgba(154,163,200,.14);color:var(--muted)}
.st-ACTIVE{background:rgba(69,210,198,.15);color:var(--data)}
.st-COMPLETED{background:rgba(74,222,128,.15);color:var(--good)}
.st-FAILED{background:rgba(248,113,113,.15);color:var(--bad)}
.st-MANUAL{background:rgba(251,191,36,.15);color:var(--warn)}
.msg{border-radius:12px;padding:12px 14px;font-weight:600;font-size:14px}
.msg.bad{background:rgba(248,113,113,.12);border:1px solid rgba(248,113,113,.4);color:#ffc9c9}
.msg.ok{background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.4);color:#c8f7d8}
.msg.info{background:rgba(69,210,198,.1);border:1px solid rgba(69,210,198,.35);color:#c9f4f0}
.cheat{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cheat button{background:var(--panel2);border:1px dashed var(--line);border-radius:10px;padding:10px;font-size:13px;text-align:left;color:var(--muted)}
.xpburst{text-align:center;padding-block:14px}
.xpburst b{display:block;font:800 72px/1 var(--display);color:var(--court);animation:pop .6s ease}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* sports id */
.idcard{position:relative;border-radius:18px;padding:18px;overflow:hidden;background:#101836;border:1px solid var(--line)}
.idcard::before{content:"";position:absolute;inset:0;background:
  linear-gradient(90deg,transparent 49.6%,rgba(255,255,255,.06) 49.6% 50.4%,transparent 50.4%),
  radial-gradient(circle at 50% 50%,transparent 62px,rgba(255,255,255,.06) 62px 64px,transparent 64px),
  linear-gradient(135deg,rgba(255,122,47,.18),transparent 55%)}
.idcard>*{position:relative}
.idno{font:700 14px/1 var(--display);letter-spacing:.2em;color:var(--court)}
.idname{font:900 26px/1.1 var(--body);margin-top:10px}
.idgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.idgrid div{border-top:1px solid var(--line);padding-top:8px}
.idgrid b{display:block;font:800 22px/1 var(--display)}
.idgrid span{font-size:11px;color:var(--muted)}
.badges{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.badge{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:6px 9px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.badge i{width:10px;height:10px;border-radius:2px;transform:rotate(45deg);background:var(--court)}

/* ranking */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel2);border-radius:10px;padding:4px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:9px;border-radius:7px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--panel);color:var(--fg);box-shadow:0 0 0 1px var(--line)}
.rk{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--panel);border:1px solid var(--line)}
.rk.me{border-color:var(--court);background:linear-gradient(90deg,rgba(255,122,47,.12),var(--panel) 60%)}
.rk .pos{font:800 26px/1 var(--display);text-align:center}
.rk .pos.p1{color:#ffd166}.rk .pos.p2{color:#d9e1f2}.rk .pos.p3{color:#e3a072}
.rk .sc{font:800 26px/1 var(--display);text-align:right}
.rk .sc small{display:block;font-size:10px;color:var(--muted);letter-spacing:.12em}
.mini{display:flex;gap:10px;margin-top:6px;font-size:11.5px;color:var(--muted);flex-wrap:wrap}
.mini b{color:var(--fg);font-family:var(--display);font-size:13px}

/* more */
.menu{display:flex;flex-direction:column;border-radius:14px;overflow:hidden;border:1px solid var(--line)}
.menu button{display:flex;align-items:center;gap:12px;background:var(--panel);border:0;border-bottom:1px solid var(--line);padding:16px;text-align:left}
.menu button:last-child{border-bottom:0}
.menu .k{font:800 15px/1 var(--display);letter-spacing:.1em;width:96px}
.menu .d{flex:1;color:var(--muted);font-size:13px}
.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font:600 11.5px/1 var(--display);letter-spacing:.12em;color:var(--muted);text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl td.r,.tbl th.r{text-align:right}
.scroll{overflow-x:auto}
.grow{color:var(--good);font-weight:700;font-size:12.5px}
.grow.down{color:var(--bad)}
.trophies{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.trophy{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 10px;text-align:center}
.trophy svg{width:40px;height:40px}
.trophy b{display:block;font-size:13px;margin-top:6px}
.trophy span{font-size:11px;color:var(--muted)}
.trophy.lock{opacity:.4}

/* login */
.login{max-width:440px;margin:0 auto;padding:32px 16px 40px;display:flex;flex-direction:column;gap:18px}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:700;color:var(--muted)}
.field input,.field select{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 14px;color:var(--fg);font:inherit;width:100%}
.loginphoto{height:180px;border-radius:18px;background:center/cover no-repeat;position:relative;overflow:hidden}
.loginphoto::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 30%,rgba(13,20,48,.9))}
.loginphoto div{position:absolute;left:16px;bottom:14px;z-index:1;font:800 30px/1 var(--display)}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;background:var(--fg);color:var(--ink);font-weight:700;font-size:14px;padding:10px 16px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
#toast.on{opacity:1}

/* ---------- admin ---------- */
.admin{display:grid;grid-template-columns:232px 1fr;min-height:100%}
.side{background:#0a1028;border-right:1px solid var(--line);padding:20px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh;overflow:auto}
.side .brand{padding:0 10px 14px}
.side .grp{font:600 11px/1 var(--display);letter-spacing:.16em;color:var(--dim);padding:14px 10px 6px}
.side button{display:flex;justify-content:space-between;align-items:center;background:none;border:0;border-radius:8px;padding:10px;text-align:left;font-weight:500;color:var(--muted);font-size:14px}
.side button.on{background:var(--panel2);color:var(--fg)}
.side button small{font:600 10px/1 var(--display);letter-spacing:.1em;color:var(--warn)}
.main{padding:24px 28px 48px;min-width:0}
.ahead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.ahead h1{font:800 34px/1 var(--display);letter-spacing:.02em}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
.kpi b{display:block;font:800 34px/1.05 var(--display)}
.kpi span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;margin-top:14px}
.hbar{display:grid;grid-template-columns:64px 1fr 48px;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.hbar .bar{height:12px}
.livehead{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.count{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:13px}
.count b{font:800 22px/1 var(--display)}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:rgba(248,113,113,.08);border:1px solid rgba(248,113,113,.3);font-size:13px;margin-bottom:8px}
.alert b{color:#ffc9c9}
.qrstage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,300px);gap:18px}
.qrbig{border-radius:20px;padding:28px;display:flex;flex-direction:column;align-items:center;gap:16px;border:3px solid}
.qrbig.in{border-color:var(--good);background:rgba(74,222,128,.06)}
.qrbig.out{border-color:var(--court);background:rgba(255,122,47,.06)}
.qrbig .mode{font:800 44px/1 var(--display);letter-spacing:.06em}
.qrbox{background:#fff;padding:16px;border-radius:14px;width:min(320px,100%);aspect-ratio:1/1;display:grid;place-items:center}
.qrbox canvas,.qrbox img{width:100%!important;height:auto!important;image-rendering:pixelated}
.qrtimer{width:min(320px,100%)}
.toggle{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggle button{border:1px solid var(--line);background:var(--panel2);border-radius:10px;padding:12px;font-weight:700}
.toggle button.on.in{background:var(--good);color:#06240f;border-color:var(--good)}
.toggle button.on.out{background:var(--court);color:#1b0d03;border-color:var(--court)}
.popsgrid input{width:76px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:6px 8px;color:var(--fg);font:600 14px var(--display);text-align:right}
.ph-note{display:inline-flex;gap:8px;align-items:center;font-size:12.5px;color:var(--warn)}

/* podium */
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:14px;align-items:end}
.prize{position:relative;border-radius:18px;padding:16px;background:var(--panel);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.prize.p1{order:2;border-color:var(--gold);background:linear-gradient(180deg,rgba(255,209,102,.16),var(--panel) 70%);padding-block:22px}
.prize.p2{order:1;border-color:rgba(207,216,234,.6)}
.prize.p3{order:3;border-color:rgba(227,154,106,.6)}
.rankno{font:800 15px/1 var(--display);letter-spacing:.18em}
.p1 .rankno{color:var(--gold)}.p2 .rankno{color:var(--silver)}.p3 .rankno{color:var(--bronze)}
.prize svg.art{width:100%;max-width:190px;height:auto}
.prize .what{font:900 22px/1.15 var(--body)}
.p1 .what{font-size:28px}
.holder{display:flex;align-items:baseline;gap:8px;justify-content:center;flex-wrap:wrap}
.holder b{font:800 30px/1 var(--display)}
.p1 .holder b{font-size:40px}
.holder span{color:var(--muted);font-size:13px}

/* race */
.track{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px 16px 10px;overflow-x:auto}
.track-inner{min-width:560px}
.scale{display:grid;grid-template-columns:92px 1fr 120px;gap:12px;font:600 12px/1 var(--display);letter-spacing:.1em;color:var(--dim);padding-bottom:8px}
.scale .ticks{position:relative;height:14px}
.scale .ticks span{position:absolute;transform:translateX(-50%)}
.lane{display:grid;grid-template-columns:92px 1fr 120px;gap:12px;align-items:center;padding-block:7px;border-top:1px solid var(--line)}
.lane .cls{font:800 22px/1 var(--display)}
.lane .cls small{display:block;font:500 12px/1.3 var(--body);color:var(--muted);margin-top:3px}
.road{position:relative;height:34px;border-radius:17px;background:
  repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),rgba(255,255,255,.07) calc(10% - 1px) 10%),var(--ink);border:1px solid var(--line)}
.road .fill{position:absolute;left:0;top:0;bottom:0;border-radius:17px;background:linear-gradient(90deg,rgba(69,210,198,.15),rgba(69,210,198,.45));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}

<div class="demo-bar">체험판 <span>· 화면과 흐름만 보는 연습용이에요. 이름과 기록은 모두 예시예요.</span></div>

<script>
(function(){
const PHOTO = "img/splash.jpg";
const $app = document.getElementById("app");
const ADMIN = location.hash === "#admin";

/* ---------- demo data (all fictional) ---------- */
const PROGRAMS = [
  {id:"test", name:"체험 테스트", min:20, xp:15, geo:false, color:"var(--data)"},
  {id:"morning", name:"아침 운동", min:600, xp:30, geo:true, color:"var(--court)"},
  {id:"lunch", name:"점심 운동", min:300, xp:20, geo:true, color:"var(--warn)"},
  {id:"special", name:"특별 프로그램", min:180, xp:15, geo:false, color:"var(--good)"}
];
const NAMES = ["강도윤","고서연","권민재","김서준","김지아","남하린","노윤우","문채원","박시우","배수아","서예준","김하준","손유나","송지호","안다은","오건우","유하은","윤재민","이서아","임도현","장나윤","정우진","조아린","최승현","한소율"];
const ME_IDX = 11;
const now = () => Date.now();
const S = {
  view: ADMIN ? "admin-login" : "splash",
  tab:"home", sub:null, rankMode:"class",
  xp: 1340, history:[
    {d:"10.07",p:"아침 운동",st:"COMPLETED",xp:30},
    {d:"10.06",p:"아침 운동",st:"COMPLETED",xp:30},
    {d:"10.06",p:"점심 운동",st:"FAILED",xp:0},
    {d:"10.02",p:"아침 운동",st:"MANUAL",xp:30},
    {d:"10.01",p:"특별 프로그램",st:"COMPLETED",xp:15}
  ],
  att:null,   // {prog, state, inAt, outAt, window}
  pick:"test", msg:null, done:null,
  // admin
  aview:"dash", qrMode:"in", sessionOpen:true, live:null, alerts:[], issued:{}
};

/* ---------- level / tier ---------- */
function levelOf(xp){let lv=1,need=100,acc=0;while(xp>=acc+need){acc+=need;lv++;need=100+20*(lv-1);}return {lv, into:xp-acc, need};}
function tierOf(seasonXp){const t=[["LEGEND",2000],["ELITE",1300],["GOLD",800],["SILVER",400],["BRONZE",150],["ROOKIE",0]];for(const [n,v] of t) if(seasonXp>=v) return n;return "ROOKIE";}
const seasonXp = () => S.xp - 740;

/* ---------- helpers ---------- */
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const mmss = s => { s=Math.max(0,Math.ceil(s)); const m=Math.floor(s/60); return (m?m+"분 ":"")+(s%60)+"초"; };
const clock = s => { s=Math.max(0,Math.ceil(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); };
const prog = id => PROGRAMS.find(p=>p.id===id);
const mask = n => n[0]+"*"+n.slice(2);
let toastT; function toast(t){const el=document.getElementById("toast");el.textContent=t;el.classList.add("on");clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove("on"),2200);}
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0).toString(36).toUpperCase().padStart(7,"0");}
const QR_INT = 30;
const qrWindow = () => Math.floor(now()/1000/QR_INT);
const token = (mode,w) => hash("nongso-secret|"+mode+"|"+w)+hash(mode+w).slice(0,3);

/* ---------- icons ---------- */
const IC = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8V5a1 1 0 0 1 1-1h3M16 4h3a1 1 0 0 1 1 1v3M20 16v3a1 1 0 0 1-1 1h-3M8 20H5a1 1 0 0 1-1-1v-3"/><rect x="8" y="8" width="8" height="8" rx="1"/></svg>',
  my:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="11" r="2.4"/><path d="M5.8 16.5c.8-1.6 1.9-2.3 3.2-2.3s2.4.7 3.2 2.3M14.5 10h4M14.5 13.5h3"/></svg>',
  rank:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 20h18M5 20v-6h4v6M10 20V8h4v12M15 20v-9h4v9"/></svg>',
  more:'<svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>',
  back:'<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M15 5l-7 7 7 7"/></svg>',
  trophy:c=>`<svg viewBox="0 0 40 40" fill="none" stroke="${c}" stroke-width="2.4" stroke-linejoin="round"><path d="M12 6h16v8a8 8 0 0 1-16 0z"/><path d="M12 9H6v2a6 6 0 0 0 6 6M28 9h6v2a6 6 0 0 1-6 6M20 22v6M14 34h12M16 28h8v6h-8z"/></svg>`
};

/* ---------- live sim (shared by teacher view) ---------- */
function initLive(){
  if(S.live) return;
  const t=now();
  S.live = NAMES.map((n,i)=>{
    if(i===ME_IDX) return {n,i,me:true};
    const r=Math.random();
    if(r<.35) return {n,i,state:"COMPLETED",inAt:t-60000,outAt:t-20000};
    if(r<.6) return {n,i,state:"ACTIVE",inAt:t-Math.random()*18000};
    return {n,i,state:"WAITING"};
  });
  S.alerts=[{t:"07:52",text:"<b>같은 기기 거부</b> · 정우진 학생 폰으로 다른 학생 체크인 시도"},{t:"07:49",text:"<b>만료된 QR</b> · 노윤우 학생이 2분 전 QR로 시도 (사진 공유 의심)"}];
}
function meRow(){
  const a=S.att;
  if(!a || a.prog!=="test") return {state:"WAITING"};
  return {state:a.state,inAt:a.inAt,outAt:a.outAt};
}
function tickLive(){
  if(!S.live||!S.sessionOpen) return;
  const t=now(), min=prog("test").min*1000;
  S.live.forEach(s=>{
    if(s.me) return;
    if(s.state==="WAITING" && Math.random()<.08){s.state="ACTIVE";s.inAt=t;}
    else if(s.state==="ACTIVE" && t-s.inAt>=min && Math.random()<.35){s.state="COMPLETED";s.outAt=t;}
  });
}
setInterval(tickLive,2000);

/* ---------- student: attendance logic (stand-in for the server function) ---------- */
function scan(mode, opts={}){
  const p=prog(S.pick);
  S.msg=null;
  if(opts.expired){S.msg={k:"bad",t:"QR이 만료됐어요. 지금 화면에 떠 있는 QR을 다시 찍어 주세요."};return render();}
  if(opts.otherDevice){S.msg={k:"bad",t:"이 기기는 이 세션에서 이미 다른 학생이 인증했어요. 내 휴대폰으로 찍어 주세요."};return render();}
  const a=S.att && S.att.prog===p.id ? S.att : null;
  if(mode==="in"){
    if(a && a.state==="ACTIVE"){S.msg={k:"info",t:"이미 CHECK-IN 했어요. 운동을 마치고 CHECK-OUT QR을 찍어 주세요."};return render();}
    if(a && (a.state==="COMPLETED"||a.state==="MANUAL")){S.msg={k:"info",t:"오늘 이 프로그램은 이미 완료했어요."};return render();}
    const geo = p.geo ? " · 위치 확인 완료 (기준점에서 30m)" : "";
    S.att={prog:p.id,state:"ACTIVE",inAt:now(),window:qrWindow()};
    S.msg={k:"ok",t:"CHECK-IN 완료"+geo+". 지금부터 시간을 잴게요."};
    S.done=null;
    return render();
  }
  // out
  if(!a || a.state!=="ACTIVE"){S.msg={k:"bad",t:"먼저 CHECK-IN QR을 찍어야 해요."};return render();}
  const left=p.min - (now()-a.inAt)/1000;
  if(left>0){S.msg={k:"bad",t:`아직 활동 인증 시간이 충족되지 않았습니다. ${mmss(left)} 남았어요.`};return render();}
  const before=levelOf(S.xp).lv;
  a.state="COMPLETED"; a.outAt=now();
  S.xp+=p.xp;
  S.history.unshift({d:"10.08",p:p.name,st:"COMPLETED",xp:p.xp});
  S.done={xp:p.xp,up:levelOf(S.xp).lv>before,lv:levelOf(S.xp).lv};
  S.msg=null;
  render();
}


/* ---------- class race (head counts from the 2026 roster, participation is example) ---------- */
const SIZES={1:[27,27,27,27,26,27,27,27,25],2:[25,26,25,26,26,26],3:[29,27,29,27,29]};
const RDAYS=8;
function rsample(g){return SIZES[g].map((n,i)=>{const base=[.58,.71,.49,.83,.64,.76,.55,.68,.61][(i+g*2)%9];return Math.round(n*RDAYS*base);});}
const PRIZE={1:{what:"피자",art:pizza()},2:{what:"햄버거 · 핫도그",art:burger()},3:{what:"과자 · 간식",art:snack()}};
function raceRows(g){const sizes=SIZES[g],parts=rsample(g);const rows=sizes.map((n,i)=>({cls:i+1,n,p:parts[i],rate:parts[i]/(n*RDAYS)}));const order=[...rows].sort((a,b)=>b.rate-a.rate);order.forEach((x,i)=>x.rank=i+1);return {rows,order};}
function chaseOf(g,me){const {order}=raceRows(g);const i=order.findIndex(x=>x.cls===me);if(i<=0) return null;const m=order[i],up=order[i-1];return {need:Math.floor(up.rate*m.n*RDAYS-m.p)+1,up};}
function raceHTML(g,compact,mine){
  const {rows,order}=raceRows(g);
  const pod=[1,2,3].map(k=>{const x=order[k-1];return `<div class="prize p${k}">${PRIZE[k].art}<div class="txt"><div class="rankno">${k}등</div><div class="what">${PRIZE[k].what}</div><div class="holder"><b class="num">${g}-${x.cls}</b><span>참여율 ${Math.round(x.rate*100)}%</span></div></div></div>`;}).join("");
  const flag='<svg class="flag" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3v18" stroke="#eef1ff" stroke-width="2"/><path d="M6 4h12l-3 4 3 4H6z" fill="#ff7a2f"/></svg>';
  const lanes=`<div class="scale"><span>학급</span><div class="ticks">${[0,25,50,75,100].map(v=>`<span style="left:${v}%">${v}%</span>`).join("")}</div><span style="text-align:right">참여율</span></div>`+rows.map(x=>{const pct=Math.min(1,x.rate)*100;return `<div class="lane r${x.rank<=3?x.rank:0} ${x.cls===mine?"mine":""}"><div class="cls num">${x.cls}반<small>${x.n}명</small></div><div class="road" role="img" aria-label="${x.cls}반 참여율 ${Math.round(pct)}%"><div class="fill" style="width:${pct}%"></div>${flag}<div class="runner" style="left:clamp(20px, ${pct}%, calc(100% - 20px))">${x.cls}</div></div><div class="res"><b class="num">${Math.round(pct)}%</b>${x.rank<=3?`<span class="tag">${x.rank}등</span>`:""}<small>${x.rank}위 · 누적 ${x.p}명</small></div></div>`;}).join("");
  const ch=[];for(const i of [3,1,2,4]){if(i>=order.length)continue;const m=order[i],up=order[i-1];const need=Math.floor(up.rate*m.n*RDAYS-m.p)+1;const goal=up.rank<=3?`${up.rank}등 ${PRIZE[up.rank].what}`:`${up.rank}위`;ch.push(`<div><b class="num">${g}-${m.cls}</b> 참여 <b class="num">${need}번</b>만 더 모이면<br><span style="color:var(--muted)">${g}-${up.cls}반을 따라잡고 ${goal} 자리에 올라요</span></div>`);if(ch.length===(compact?2:3))break;}
  return `<div class="racewrap ${compact?"compact":""}"><section class="podium">${pod}</section><section class="track"><div class="track-inner">${lanes}</div></section><section class="chase">${ch.join("")}</section></div>`;
}
/* ---- prize illustrations (flat, drawn inline) ---- */
function pizza(){return `<svg class="art" viewBox="0 0 200 140" aria-hidden="true">
  <ellipse cx="100" cy="128" rx="78" ry="8" fill="rgba(0,0,0,.25)"/>
  <circle cx="100" cy="72" r="58" fill="#e8a24a"/><circle cx="100" cy="72" r="50" fill="#f6c453"/>
  <path d="M100 72 L150 50 A50 50 0 0 0 128 30 Z" fill="#0d1430" opacity=".9"/>
  <g fill="#d6452f"><circle cx="78" cy="56" r="8"/><circle cx="116" cy="92" r="8"/><circle cx="76" cy="94" r="7"/><circle cx="104" cy="44" r="6"/><circle cx="130" cy="72" r="7"/></g>
  <g fill="#3f8f4a"><rect x="92" y="66" width="8" height="4" rx="2" transform="rotate(30 96 68)"/><rect x="62" y="74" width="8" height="4" rx="2"/><rect x="100" y="104" width="8" height="4" rx="2" transform="rotate(-20 104 106)"/></g>

function onMotion(e){

/* 자세 인식 (예전 체험판의 카운터를 그대로 옮김, MediaPipe Pose) */
const ang=(a,b,c)=>{const r=Math.atan2(c.y-b.y,c.x-b.x)-Math.atan2(a.y-b.y,a.x-b.x);const d=Math.abs(r*180/Math.PI);return d>180?360-d:d;};

function makeCounter(kind){
  const c={kind,reps:0,secs:0,phase:"up",depth:0,cue:"준비 자세를 잡아 주세요",good:true,last:0,top:0,hintUntil:0,minSeen:1};
  const hint=(t,msg)=>{c.cue=msg;c.good=false;c.hintUntil=t+1500;};
  c.step=(lm,t,aspect=1)=>{
    const P=i=>({x:lm[i].x*aspect,y:lm[i].y});
    const seen=ids=>ids.every(i=>(lm[i].visibility??1)>VIS);
    const sideOk=Q=>seen([Q.hip,Q.kn,Q.an]);
    const keepHint=t<c.hintUntil;
    if(kind==="squat"||kind==="lunge"){
      const legs=[LS,RS].filter(sideOk);
      if(!legs.length){c.cue="다리까지 다 보이게 카메라에서 조금 멀어져 주세요";c.good=false;return;}
      const per=legs.map(Q=>{const h=P(Q.hip),k=P(Q.kn),a=P(Q.an);return {r:(k.y-h.y)/Math.max(.02,a.y-k.y),knee:ang(h,k,a)};});
      const r=Math.min(...per.map(x=>x.r)),knee=Math.min(...per.map(x=>x.knee));

        else if(r>.9&&c.minSeen<.8){hint(t,kind==="squat"?"조금 더 깊이 앉아요 (허벅지가 바닥과 나란히)":"무릎을 90도까지 굽혀요");c.minSeen=1;}
      } else if(r>upR&&knee>150){c.phase="up";c.reps++;}
      if(keepHint) return;
      c.cue=c.phase==="down"?"좋아요! 이제 일어나요":kind==="squat"?"천천히 앉아요":"한 발 앞으로, 무릎을 굽혀요";c.good=true;
    } else if(kind==="pushup"){

      if(!arms.length){c.cue="어깨와 손이 화면에 보이게 해 주세요";c.good=false;return;}
      const h=arms.reduce((s,Q)=>s+(P(Q.wr).y-P(Q.sh).y),0)/arms.length;
      const els=arms.filter(Q=>seen([Q.el])).map(Q=>ang(P(Q.sh),P(Q.el),P(Q.wr)));
      const elbow=els.length?Math.min(...els):180;
      if(c.phase==="up") c.top=Math.max(c.top*.997,h);
      const ratio=c.top>.02?h/c.top:1;
      c.depth=clamp01((1-ratio)/.4);
      const side=!seen([11,12])||Math.abs(P(11).x-P(12).x)<.08;
      if(c.phase==="up"&&c.top>.05&&(ratio<.6||side&&elbow<95)) c.phase="down";
      else if(c.phase==="down"&&ratio>.85&&(!side||elbow>140)){c.phase="up";c.reps++;}
      if(keepHint) return;
      const Q=arms[0];
      const lineOk=!seen([Q.hip,Q.an])||Math.abs(P(Q.sh).x-P(Q.an).x)<.3||ang(P(Q.sh),P(Q.hip),P(Q.an))>150;
      c.cue=!lineOk?"허리가 처지거나 솟았어요. 몸을 일자로!":c.phase==="down"?"좋아요! 밀어 올려요":"가슴을 바닥 가까이 내려요"; c.good=lineOk;
    } else if(kind==="jack"){
      if(!seen([11,12,15,16])){c.cue="팔이 다 보이게 카메라에서 조금 멀어져 주세요";c.good=false;return;}
      const torso=seen([23,24])?Math.abs((P(23).y+P(24).y)/2-(P(11).y+P(12).y)/2):.25;
      const up=P(15).y<P(11).y&&P(16).y<P(12).y, down=P(15).y>P(11).y+torso*.4&&P(16).y>P(12).y+torso*.4;

    } else if(kind==="plank"){
      const Q=[LS,RS].filter(X=>seen([X.sh,X.hip,X.an])).sort((a,b)=>lm[b.hip].visibility-lm[a.hip].visibility)[0];
      if(!Q){c.cue="옆으로 엎드려 머리부터 발끝까지 보이게 해 주세요";c.good=false;c.last=0;return;}

      c.good=ok;
    }
  };
  return c;
}

const BONES=[[11,12],[11,13],[13,15],[12,14],[14,16],[11,23],[12,24],[23,24],[23,25],[25,27],[24,26],[26,28]];
function drawPose(lm,ctx,w,h,good){

  ctx.lineWidth=Math.max(3,w/120); ctx.strokeStyle=good?"#4ade80":"#ff7a2f"; ctx.lineCap="round";
  for(const [a,b] of BONES){ctx.beginPath();ctx.moveTo(lm[a].x*w,lm[a].y*h);ctx.lineTo(lm[b].x*w,lm[b].y*h);ctx.stroke();}

function mSubs(m){
  const mi=+m.id.replace(/\D/g,"")||1;
  return NAMES.map((n,i)=>{
    if(i===ME_IDX) return {n,i,me:true,done:m.done,cur:m.cur};
    if((i*7+mi*3)%5===0) return {n,i,done:null,cur:Math.round(m.goal*((i*13)%7)/10)};
    const v=m.goal+((i*37)%(m.kind==="walk"?260:4));
    if(m.kind!=="walk") return {n,i,done:{v,at:"10.0"+(7+i%2)+" "+String(7+(i%10)).padStart(2,"0")+":"+String((i*11)%60).padStart(2,"0")}};
    const cad=i===8?184:96+((i*13)%34);   // 분당 걸음
    return {n,i,done:{v,at:"10.0"+(7+i%2)+" "+String(7+(i%10)).padStart(2,"0")+":"+String((i*11)%60).padStart(2,"0"),secs:Math.round(v/cad*60)}};
  });
}

function drawQr(){
  const box=document.getElementById("qrbox"); if(!box) return;
  const key=S.qrMode+qrWindow(); if(qrDrawn===key && box.childElementCount) return;
  qrDrawn=key; box.innerHTML="";
  const text="NONGSO-DEMO|"+S.qrMode.toUpperCase()+"|"+token(S.qrMode,qrWindow());
  try{ new QRCode(box,{text,width:288,height:288,colorDark:"#0d1430",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M}); }
  catch(e){ box.innerHTML='<div style="color:#0d1430;font-weight:700;text-align:center">'+esc(text)+'</div>'; }
}

  const m={
    sessions:["QR 출석 세션","오늘 열린 세션과 지난 기록",`<table class="tbl"><thead><tr><th>날짜</th><th>프로그램</th><th>대상</th><th class="r">완료</th><th>상태</th></tr></thead><tbody><tr><td class="num">10.08</td><td>체험 테스트</td><td>2-3</td><td class="r num">–</td><td><span class="state st-ACTIVE">OPEN</span></td></tr><tr><td class="num">10.08</td><td>아침 운동</td><td>2학년 전체</td><td class="r num">118</td><td><span class="state st-ACTIVE">OPEN</span></td></tr><tr><td class="num">10.07</td><td>아침 운동</td><td>2학년 전체</td><td class="r num">142</td><td><span class="state st-WAITING">CLOSED</span></td></tr></tbody></table>`],
    classes:["학급","학급과 담당 교사",`<table class="tbl"><thead><tr><th>학급</th><th class="r">학생</th><th>담당 교사</th></tr></thead><tbody>${[1,2,3,4,5,6,7,8].map(n=>`<tr><td>2학년 ${n}반</td><td class="r num">${24+(n%3)}</td><td>${n<=4?"체육 교사 A":"체육 교사 B"}</td></tr>`).join("")}</tbody></table>`],
    xp:["XP","레벨표와 수동 조정",`<table class="tbl"><thead><tr><th>레벨</th><th class="r">다음 레벨까지</th><th class="r">누적</th></tr></thead><tbody>${[1,2,3,5,10,13,15].map(l=>{let acc=0;for(let n=1;n<l;n++)acc+=100+20*(n-1);return `<tr><td class="num">LV ${l}</td><td class="r num">${100+20*(l-1)} XP</td><td class="r num">${acc.toLocaleString()} XP</td></tr>`}).join("")}</tbody></table><p class="small muted">수동 조정은 사유를 꼭 적고, 기록은 지워지지 않아요.</p>`],
    settings:["설정","학교 위치, QR 주기, 교사 초대",`<table class="tbl"><tbody><tr><td>QR 바뀌는 주기</td><td class="r"><b class="num">30초</b></td></tr><tr><td>위치 기준점</td><td class="r">체육관 앞 · 반경 80m</td></tr><tr><td>개인 랭킹 이름</td><td class="r">가운데 글자 가림</td></tr><tr><td>교사 계정</td><td class="r">총괄 1 · 일반 1</td></tr></tbody></table>`]
  }[k];
  if(!m){const ph={season:"PHASE 2",challenge:"PHASE 2",badge:"PHASE 2",stats:"PHASE 4"}[k];const t=AMENU.find(x=>x[0]===k)[1];
    return `<div class="ahead"><div><span class="eyebrow">${ph}</span><h1>${t}</h1></div></div><div class="card"><p class="muted" style="margin:0">${t} 화면은 ${ph}에서 만들어요. 학생 화면의 같은 메뉴에서 어떻게 보일지는 미리 볼 수 있어요.</p></div>`;}
  return `<div class="ahead"><div><span class="eyebrow">${m[1]}</span><h1>${m[0]}</h1></div></div><div class="card scroll" style="padding:6px 10px">${m[2]}</div>`;
}
function aRace(){
  const g=S.raceGrade||1;
  return `<div class="ahead"><div><span class="eyebrow">${g}학년 ${SIZES[g].length}개 반 · 10.12 ~ 10.30 · TV에 띄우는 화면</span><h1>아침 운동 학급 레이스</h1></div><div class="gtabs">${[1,2,3].map(x=>`<button data-act="rgrade" data-v="${x}" class="${x===g?"on":""}">${x}학년</button>`).join("")}</div></div>
    <div class="msg info small" style="font-weight:500;margin-bottom:14px">반 인원은 2026학년도 명렬 기준이고, 참여 기록은 예시예요.</div>${raceHTML(g,false,0)}`;
}
function vAdmin(){
  const k=S.aview;
  const body = k==="race"?aRace():k==="mission"?aMission():k==="dash"?aDash():k==="live"?aLive():k==="qr"?aQr():k==="students"?aStudents():k==="programs"?aPrograms():k==="pops"?aPops():aSimple(k);
  return `<div class="admin"><aside class="side"><div class="brand">NONGSO <em>ADMIN</em></div><div class="grp">PHASE 1</div>
    ${AMENU.map((m,i)=>`${i===11?'<div class="grp">다음 단계</div>':""}<button data-act="aview" data-v="${m[0]}" class="${k===m[0]?"on":""}">${m[1]}${m[2]?`<small>${m[2]}</small>`:""}</button>`).join("")}
    </aside><main class="main">${body}</main></div>`;
}

/* ---------- render & events ---------- */
function render(){
  if(!(S.view==="app"&&S.sub==="mrun")) mStopAll();
  let html;
  if(S.view==="splash") html=vSplash();
  else if(S.view==="login") html=vLogin();
  else if(S.view==="admin-login") html=vAdminLogin();
  else if(S.view==="admin") html=vAdmin();
  else html=vStudent();
  $app.innerHTML=html;
  if(S.view==="admin"&&S.aview==="qr"){qrDrawn="";drawQr();}
  if(S.view==="splash"){const sp=document.getElementById("splash");sp.addEventListener("click",go);sp.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" ")go();});clearTimeout(window.__spT);window.__spT=setTimeout(go,2400);}
}
function go(){ if(S.view==="splash"){S.view="login";render();} }

// light per-second refresh without rebuilding inputs
setInterval(()=>{
  if(S.view==="app"){
    const a=S.att;
    if(a&&a.state==="ACTIVE"&&(S.tab==="check"||S.tab==="home")){
      const p=prog(a.prog),el=(now()-a.inAt)/1000,left=p.min-el;
      const L=document.querySelector('[data-live="left"]');
      if(L){
        if(left<=0 && !L.dataset.ready){render();const n=document.querySelector('[data-live="left"]');if(n)n.dataset.ready="1";return;}
        L.textContent=left>0?clock(left):"00:00";
        const ring=document.querySelector('[data-live="ring"]');if(ring){const C=2*Math.PI*96;ring.setAttribute("stroke-dashoffset",C*(1-Math.min(1,el/p.min)));}
      }
      const H=document.querySelector('[data-live="homeLeft"]');
      if(H){ if(left<=0&&!H.dataset.ready){render();const n=document.querySelector('[data-live="homeLeft"]');if(n)n.dataset.ready="1";} else if(left>0) H.firstChild.textContent=clock(left); }
    }
  } else if(S.view==="admin"){
    if(S.aview==="qr"){
      const left=QR_INT-(now()/1000%QR_INT);
      if(qrDrawn!==S.qrMode+qrWindow()){render();return;}
      const l=document.querySelector('[data-live="qrleft"]'),b=document.querySelector('[data-live="qrbar"]');
      if(l)l.textContent=Math.ceil(left)+"초"; if(b)b.style.width=(left/QR_INT*100)+"%";
    } else if(S.aview==="live"||S.aview==="dash"){ render(); }
  }
},1000);

document.addEventListener("submit",e=>{
  e.preventDefault();
  if(e.target.id==="loginForm"){S.view="app";S.tab="home";render();toast(S.sub==="activate"?"명렬과 확인됐어요. 계정을 만들었어요.":"로그인했어요");S.sub=null;}
  if(e.target.id==="aLoginForm"){S.view="admin";S.aview="dash";initLive();render();}
});
document.addEventListener("click",e=>{
  const b=e.target.closest("[data-act]"); if(!b) return;
  const act=b.dataset.act, v=b.dataset.v;
  switch(act){
    case "login-tab": S.sub=v||null; render(); break;
    case "tab": S.tab=v; S.sub=null; if(v==="check"&&S.att&&S.att.state!=="ACTIVE"&&!S.done){S.msg=null;} render(); window.scrollTo(0,0); break;
    case "pick": S.pick=v; S.tab="check"; S.msg=null; if(!(S.att&&S.att.prog===v)) S.done=null; render(); window.scrollTo(0,0); break;
    case "pickstay": S.pick=v; S.msg=null; render(); break;
    case "scan": scan(v); break;
    case "cheat": scan("in",{expired:v==="expired",otherDevice:v==="device"}); break;
    case "reset": S.att=null; S.done=null; S.msg=null; render(); break;
    case "rank": S.rankMode=v; render(); break;
    case "sub": S.sub=v||null; render(); window.scrollTo(0,0); break;
    case "logout": S.view="login"; S.sub=null; render(); break;
    case "aview": S.aview=v; render(); window.scrollTo(0,0); break;
    case "papsg": S.papsG=+v; render(); break;
    case "papss": S.papsS=v; render(); break;
    case "sgrade": S.sGrade=+v; render(); break;
    case "rgrade": S.raceGrade=+v; render(); break;
    case "qrmode": S.qrMode=v; render(); break;
    case "close": S.sessionOpen=false; liveRows(); S.live.forEach(s=>{if(!s.me&&s.state==="ACTIVE")s.state="FAILED";}); if(S.att&&S.att.prog==="test"&&S.att.state==="ACTIVE"){S.att.state="FAILED";S.history.unshift({d:"10.08",p:"체험 테스트",st:"FAILED",xp:0});} render(); toast("세션을 닫았어요. 남은 ACTIVE는 FAILED가 됐어요."); break;
    case "reopen": S.sessionOpen=true; render(); break;
    case "manual": { const s=S.live[+v]; s.state="MANUAL"; render(); toast(s.n+" 학생을 MANUAL로 인정했어요 (+15 XP)"); break; }
    case "issue": S.issued[+v]=1; render(); toast(NAMES[+v]+" 학생 비밀번호를 초기화했어요. 다음 접속 때 새로 만들어요."); break;
    case "popsave": toast("체험판이라 저장하지 않았어요. 실제 앱에서는 한 번에 저장돼요."); break;
    case "mstart": S.tab="more"; S.sub="mrun"; S.mid=v; render(); window.scrollTo(0,0); break;
    case "mlist": S.tab="more"; S.sub="mission"; render(); window.scrollTo(0,0); break;
    case "wgo": walkStart(); break;
    case "wstop": walkStop("멈췄어요. 이어서 걷기를 누르면 다시 세요."); break;
    case "mdemo": { const m=mById(S.mid); if(m&&m.kind==="walk") W.elapsed+=(+v)/108*60; mAdd(+v); break; }
    case "mcam": poseCamera(); break;
    case "madd": mAddFromForm(); break;
    case "mview": S.mview=S.mview===v?null:v; render(); break;
    case "noop": toast("체험판에서는 이 버튼이 동작하지 않아요"); break;
  }
});
window.addEventListener("hashchange",()=>{ if(location.hash==="#admin"&&!S.view.startsWith("admin")){S.view="admin-login";render();} else if(location.hash!=="#admin"&&S.view.startsWith("admin")){S.view="login";render();} });
render();
})();
</script>
